# Servidor de produção (PC dedicado): PostgreSQL + API + Caddy (HTTPS) + backup diário.
# Uso, dentro desta pasta:  cp .env.example .env  (preencha)  &&  docker compose up -d --build
# Guia completo: docs/servidor-proprio.md
name: gestao-financeira

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: gestao
    volumes:
      - dados-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Sem "ports": o banco não fica acessível pela rede, só pela API.

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://gestao:${POSTGRES_PASSWORD}@db:5432/gestao
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_SENHA: ${SEED_SENHA:-}
      ALERTA_ATENCAO_PERCENTUAL: ${ALERTA_ATENCAO_PERCENTUAL:-80}
      ALERTA_CRITICO_PERCENTUAL: ${ALERTA_CRITICO_PERCENTUAL:-100}
    depends_on:
      db:
        condition: service_healthy
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Proxy HTTPS na frente da API. Gera e renova o certificado sozinho.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ENDERECO: ${SITE_ENDERECO:?defina SITE_ENDERECO no .env}
      TLS: ${TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - api
    logging: *logs

volumes:
  dados-postgres:
  caddy-dados:
  caddy-config:
