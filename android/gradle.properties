org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# URL da API usada pelo app (termina com /api/v1/). Pode ser sobrescrita na linha de comando:
#   ./gradlew installDebug -PapiUrlDebug=https://ENDERECO-DO-SERVIDOR/api/v1/
# Debug: API local do docker compose (10.0.2.2 = computador visto pelo emulador).
apiUrlDebug=http://10.0.2.2:3000/api/v1/
# Release: API HTTPS no PC servidor (docs/servidor-proprio.md). Trocar pelo endereço real.
apiUrlRelease=https://192.168.0.50/api/v1/
